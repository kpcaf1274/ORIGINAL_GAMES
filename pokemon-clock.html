<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ポケモンとけいべんきょう</title>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ffcb05;
            --secondary-color: #3b4cca;
            --accent-color: #ff5959;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --grass-color: #4caf50;
            --fire-color: #f44336;
            --water-color: #2196f3;
            --electric-color: #ffeb3b;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #eef5fc 0%, #d6e4f0 100%);
            font-family: 'Kosugi Maru', sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            height: 100%;
            max-width: 1024px;
            max-height: 768px;
            background: var(--card-bg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 8px solid var(--primary-color);
        }

        /* 共通ヘッダー */
        header {
            background-color: var(--secondary-color);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            margin: 0 auto;
            text-shadow: 2px 2px 0px #000;
        }

        .btn-home {
            background: var(--primary-color);
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            color: #000;
            font-weight: bold;
            font-family: 'Kosugi Maru', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 0px #cda200;
            transition: all 0.1s;
        }

        .btn-home:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* 画面エリアの切り替え */
        .screen {
            flex: 1;
            display: none;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .screen.active {
            display: flex;
        }

        /* 1. 相棒選択画面 (全員一覧) */
        #select-screen {
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 25px 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            overflow-y: auto;
        }

        .select-instruction {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
            color: var(--secondary-color);
            text-shadow: 1px 1px 0 white;
            text-align: center;
        }

        /* ポケモンリスト (全員一覧用レスポンシブグリッド) */
        .pokemon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 960px;
            padding-bottom: 40px;
        }

        .pokemon-card {
            background: white;
            border: 4px solid #ddd;
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
            aspect-ratio: 1;
        }

        .pokemon-card:hover, .pokemon-card:active {
            transform: scale(1.05);
            box-shadow: 0 10px 18px rgba(0,0,0,0.1);
        }

        .pokemon-card.grass { border-color: var(--grass-color); }
        .pokemon-card.fire { border-color: var(--fire-color); }
        .pokemon-card.water { border-color: var(--water-color); }
        .pokemon-card.electric { border-color: var(--electric-color); }

        .pokemon-card img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .pokemon-name {
            margin-top: 8px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
        }

        .type-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 2px 8px;
            border-radius: 8px;
            color: white;
            font-size: 10px;
            font-weight: bold;
        }
        .type-badge.grass { background-color: var(--grass-color); }
        .type-badge.fire { background-color: var(--fire-color); }
        .type-badge.water { background-color: var(--water-color); }
        .type-badge.electric { background-color: var(--electric-color); color: black; }

        /* 2. メインゲーム画面 */
        #game-screen {
            flex-direction: row;
            padding: 20px;
            gap: 20px;
            align-items: center;
            background: radial-gradient(circle, #ffffff 0%, #edf2f7 100%);
        }

        /* 左側: ポケモンと問題エリア */
        .left-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            padding: 10px;
        }

        .question-box {
            background-color: #fff;
            border: 4px solid var(--secondary-color);
            border-radius: 20px;
            padding: 15px;
            width: 100%;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            margin-bottom: 10px;
            position: relative;
        }

        .pokemon-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }

        .pokemon-display {
            width: 220px;
            height: 220px;
            object-fit: contain;
            filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.15));
            transition: transform 0.3s;
        }

        .pokemon-display.evolve-anim {
            animation: evolveSparkle 1.2s ease-in-out;
        }

        .pokemon-display.devolve-anim {
            animation: devolveSparkle 1.2s ease-in-out;
        }

        .pokemon-label {
            margin-top: 10px;
            font-size: 22px;
            font-weight: bold;
            background-color: var(--secondary-color);
            color: white;
            padding: 5px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* 右側: 時計盤エリア */
        .right-panel {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .clock-wrapper {
            position: relative;
            width: 380px;
            height: 380px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15), inset 0 4px 10px rgba(0,0,0,0.05);
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 12px solid #333;
        }

        #clock-svg {
            width: 100%;
            height: 100%;
        }

        /* 操作コントロール */
        .controls {
            width: 100%;
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            border: none;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Kosugi Maru', sans-serif;
            transition: all 0.1s;
            box-shadow: 0 8px 0px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.2);
        }

        .btn-check {
            background-color: #4caf50;
            color: white;
            box-shadow: 0 8px 0px #388e3c;
        }

        .btn-hint {
            background-color: var(--primary-color);
            color: black;
            box-shadow: 0 8px 0px #cda200;
        }

        /* デジタル時計表示 (ひみつ/ヒント用) */
        .digital-display {
            background-color: #222;
            color: #00ff00;
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            padding: 5px 15px;
            border-radius: 10px;
            margin-top: 15px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            display: none;
        }

        /* エフェクト演出レイヤー */
        #effect-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 成功時のお祝い文字 */
        .huge-text {
            font-size: 80px;
            font-weight: 800;
            color: var(--accent-color);
            text-shadow: 4px 4px 0px white, -4px -4px 0px white, 4px -4px 0px white, -4px 4px 0px white, 0px 8px 15px rgba(0,0,0,0.2);
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
            display: none;
        }

        /* アニメーション定義 */
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); opacity: 0.9; }
            70% { transform: scale(0.9); opacity: 0.95; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 進化のキラキラアニメーション */
        @keyframes evolveSparkle {
            0% { filter: drop-shadow(0 0 0px #fff) brightness(1); transform: scale(1); }
            50% { filter: drop-shadow(0 0 50px #fff) brightness(3); transform: scale(1.2); }
            100% { filter: drop-shadow(0 0 0px #fff) brightness(1); transform: scale(1); }
        }

        @keyframes devolveSparkle {
            0% { filter: drop-shadow(0 0 0px #2196f3) brightness(1); transform: scale(1); }
            50% { filter: drop-shadow(0 0 50px #2196f3) brightness(0.5) blur(5px); transform: scale(0.8); }
            100% { filter: drop-shadow(0 0 0px #2196f3) brightness(1); transform: scale(1); }
        }

        /* 成功クラッカーエフェクト */
        .confetti {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            animation: fall 2.5s linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(700px) rotate(360deg); opacity: 0; }
        }

        /* ヒント時の電撃エフェクト */
        .shockwave {
            stroke: var(--primary-color);
            stroke-width: 6;
            fill: none;
            stroke-dasharray: 10, 10;
            animation: shock 1s linear infinite;
            display: none;
        }

        @keyframes shock {
            to { stroke-dashoffset: -40; }
        }

        .level-select-container {
            margin-right: 5px;
            z-index: 20;
            display: none; /* デフォルト非表示、ゲーム画面のみ */
        }

        #level-select {
            background-color: var(--primary-color);
            color: #000;
            border: 3px solid #fff;
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
            font-family: 'Kosugi Maru', sans-serif;
            cursor: pointer;
            outline: none;
            box-shadow: 0 3px 0px #cda200;
            transition: all 0.1s;
        }
        
        #level-select:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* レベル選択画面 */
        #level-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
            position: relative;
            background: linear-gradient(135deg, #fef9e7 0%, #f7f1d5 100%);
            border-radius: 30px;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
        }

        #level-screen.active {
            display: flex;
        }

        #btn-level-back {
            position: absolute;
            top: 20px;
            left: 20px;
            display: block;
            background-color: #f0f0f0;
            color: #333;
            box-shadow: 0 5px 0px #ccc;
        }

        #btn-level-back:active {
            box-shadow: none;
        }

        .level-instruction {
            font-size: 26px;
            font-weight: bold;
            color: #333;
            margin-top: 40px;
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 2px 2px 0px #fff;
            font-family: 'Kosugi Maru', sans-serif;
        }

        .selected-pokemon-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            padding: 15px 40px;
            border: 5px solid var(--primary-color);
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        #level-pokemon-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0px 8px 8px rgba(0,0,0,0.12));
        }

        #level-pokemon-name {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
            font-family: 'Kosugi Maru', sans-serif;
        }

        .level-buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 960px;
            width: 100%;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .level-buttons-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .btn-level {
            background-color: #fff;
            border: 4px solid var(--primary-color);
            border-radius: 24px;
            padding: 20px 10px;
            cursor: pointer;
            box-shadow: 0 6px 0px var(--primary-color);
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 130px;
            font-family: 'Kosugi Maru', sans-serif;
        }

        .btn-level:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0px var(--primary-color);
            background-color: #fffdf2;
        }

        .btn-level:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px var(--primary-color);
        }

        .btn-level .level-num {
            font-size: 22px;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        .btn-level .level-desc {
            font-size: 15px;
            color: #444;
            text-align: center;
            line-height: 1.4;
            font-weight: bold;
        }

        .btn-level .level-desc small {
            font-size: 11px;
            opacity: 0.8;
            font-weight: normal;
        }

        /* 4択選択肢 */
        .choices-container {
            margin-top: 10px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 12px;
            border: 4px dashed var(--primary-color);
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
            width: 100%;
            box-sizing: border-box;
        }

        .choices-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            text-align: center;
            font-family: 'Kosugi Maru', sans-serif;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
        }

        .btn-choice {
            background-color: #fff;
            border: 3px solid #ddd;
            border-radius: 16px;
            padding: 12px 6px;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Kosugi Maru', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 0px #ddd;
            transition: all 0.1s ease;
            text-align: center;
            outline: none;
            color: #333;
        }

        .btn-choice:hover {
            background-color: #f7f9fa;
        }

        .btn-choice.selected {
            background-color: var(--accent-color);
            border-color: #d88900;
            color: #fff;
            box-shadow: 0 4px 0px #b07000;
        }

        .btn-choice:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* モンスターボールの揺れアニメーション */
        @keyframes pokeballShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            15% { transform: translate(-8px, 0) rotate(-15deg); }
            30% { transform: translate(6px, 0) rotate(12deg); }
            45% { transform: translate(-6px, 0) rotate(-10deg); }
            60% { transform: translate(4px, 0) rotate(8deg); }
            75% { transform: translate(-2px, 0) rotate(-4deg); }
            90% { transform: translate(1px, 0) rotate(2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .pokeball-shake-anim {
            animation: pokeballShake 0.9s cubic-bezier(.36,.07,.19,.97) both;
            transform-origin: bottom center;
        }
    </style>
</head>
<body>

<div id="app-container">
    <header>
        <button class="btn-home" id="btn-home" style="display: none;">◀ もどる</button>
        <div class="header-title">ポケモンとけいべんきょう</div>
        <div class="level-select-container">
            <select id="level-select">
                <option value="1">レベル1 (ちょうどのじかん)</option>
                <option value="2">レベル2 (30ぷん・くりあがりなし)</option>
                <option value="3">レベル3 (15ふん・くりあがりなし)</option>
                <option value="4">レベル4 (5ふん・くりあがりなし)</option>
                <option value="5">レベル5 (1ふん・くりあがりなし)</option>
                <option value="6">レベル6 (15ふん・くりあがりあり!)</option>
                <option value="7">レベル7 (5ふん・くりあがりあり!)</option>
                <option value="8">レベル8 (1ふん・くりあがりあり!)</option>
            </select>
        </div>
    </header>

    <!-- 1. 相棒選択画面 (全員一覧) -->
    <div id="select-screen" class="screen active">
        <div class="select-instruction">いっしょに べんきょうする ポケモンを えらんでね！</div>
        
        <!-- ポケモン全員一覧 -->
        <div class="pokemon-grid" id="pokemon-grid">
            <!-- JSで動的にすべての御三家を追加します -->
        </div>
    </div>

    <!-- 1.5. レベル選択画面 (新設) -->
    <div id="level-screen" class="screen">
        <button class="btn-home" id="btn-level-back">◀ えらびなおす</button>
        <div class="level-instruction">べんきょうする レベルを えらんでね！</div>
        
        <div class="selected-pokemon-preview">
            <img id="level-pokemon-img" src="" alt="Selected Pokemon">
            <div id="level-pokemon-name"></div>
        </div>

        <div class="level-buttons-grid">
            <button class="btn-level" data-level="1">
                <span class="level-num">レベル 1</span>
                <span class="level-desc">ちょうどの じかん</span>
            </button>
            <button class="btn-level" data-level="2">
                <span class="level-num">レベル 2</span>
                <span class="level-desc">30ぷん<br><small>(くりあがり なし)</small></span>
            </button>
            <button class="btn-level" data-level="3">
                <span class="level-num">レベル 3</span>
                <span class="level-desc">15ふん<br><small>(くりあがり なし)</small></span>
            </button>
            <button class="btn-level" data-level="4">
                <span class="level-num">レベル 4</span>
                <span class="level-desc">5ふん<br><small>(くりあがり なし)</small></span>
            </button>
            <button class="btn-level" data-level="5">
                <span class="level-num">レベル 5</span>
                <span class="level-desc">1ふん<br><small>(くりあがり なし)</small></span>
            </button>
            <button class="btn-level" data-level="6">
                <span class="level-num">レベル 6</span>
                <span class="level-desc">15ふん<br><span style="color:#ff4444; font-weight:bold;">(くりあがり あり!)</span></span>
            </button>
            <button class="btn-level" data-level="7">
                <span class="level-num">レベル 7</span>
                <span class="level-desc">5ふん<br><span style="color:#ff4444; font-weight:bold;">(くりあがり あり!)</span></span>
            </button>
            <button class="btn-level" data-level="8">
                <span class="level-num">レベル 8</span>
                <span class="level-desc">1ふん<br><span style="color:#ff4444; font-weight:bold;">(くりあがり あり!)</span></span>
            </button>
        </div>
    </div>

    <!-- 2. ゲーム画面 -->
    <div id="game-screen" class="screen">
        <!-- 左パネル (お題 ＆ ポケモン) -->
        <div class="left-panel">
            <div class="question-box" id="question-text">
                ロード中...
            </div>
            
            <!-- 4択選択肢エリア -->
            <div class="choices-container" id="choices-container">
                <div class="choices-title">この じかんは なにじなにぷんかな？ えらんでね！</div>
                <div class="choices-grid">
                    <button class="btn-choice" data-choice-idx="0"></button>
                    <button class="btn-choice" data-choice-idx="1"></button>
                    <button class="btn-choice" data-choice-idx="2"></button>
                    <button class="btn-choice" data-choice-idx="3"></button>
                </div>
            </div>
            
            <div class="pokemon-container">
                <!-- 自作の超高精細SVGモンスターボール -->
                <svg viewBox="0 0 100 100" width="220" height="220" id="pokeball-svg" class="pokemon-display" style="display: none;">
                    <circle cx="50" cy="50" r="46" fill="#fff" stroke="#333" stroke-width="5"/>

</div>

<script>
    // ポケモンの静的データ定義 (世代1〜9の御三家 + ピカチュウ系)
    const POKEMON_DATA = {

                { type: "fire", chain: [725, 726, 727], names: ["ニャビー", "ニャヒート", "ガオガエン"] },

        },

            name: "ガラル地方",
            starters: [
                { type: "grass", chain: [810, 811, 812], names: ["サルノリ", "バチンキー", "ゴリランダー"] },
                { type: "fire", chain: [813, 814, 815], names: ["ヒバニー", "ラビフット", "エースバーン"] },
                { type: "water", chain: [816, 817, 818], names: ["メッソン", "ジメレオン", "インテレオン"] }
            ]
        },
        "9": {
            name: "パルデア地方",
            starters: [
                { type: "grass", chain: [906, 907, 908], names: ["ニャオハ", "ヤローテ", "マスカーニャ"] },
                { type: "fire", chain: [909, 910, 911], names: ["ホゲータ", "アチゲータ", "ラウドボーン"] },
                { type: "water", chain: [912, 913, 914], names: ["クワッス", "ウェルカモ", "ウェーニバル"] }
            ]
        },
        "0": {

            starters: [
                { type: "electric", chain: [172, 25, 26], names: ["ピチュー", "ピカチュウ", "ライチュウ"] }
            ]
        }
    };

    // アプリケーションの状態
    let selectedPokemon = null; // { type, chain, names, currentStage }
    let gameState = "neutral";  // "neutral", "advance", "regress"
    let targetHour = 12;
    let targetMinute = 0;
    let baseHour = 12;
    let baseMinute = 0;
    let displayHour = 12;
    let displayMinute = 0;
    let audioContext = null;
    let currentLevel = 1; // ★現在の難易度レベル
    let selectedChoiceIdx = null; // ユーザーが選んだ4択のインデックス (0〜3)
    let currentChoices = []; // 生成された選択肢 [{ hour, minute, text }]

    // 時計ドラッグ関連の変数
    let activeDragHand = null;
    let lastAngle = 0;
    let accumulatedMinutes = 720; // 12:00 = 720分

    // DOM要素の取得
    const selectScreen = document.getElementById("select-screen");
    const levelScreen = document.getElementById("level-screen");
    const gameScreen = document.getElementById("game-screen");
    const pokemonGrid = document.getElementById("pokemon-grid");
    const btnHome = document.getElementById("btn-home");
    const btnLevelBack = document.getElementById("btn-level-back");
    const pokemonImg = document.getElementById("pokemon-img");
    const pokeballSvg = document.getElementById("pokeball-svg");
    const pokemonNameLabel = document.getElementById("pokemon-name-label");
    const questionText = document.getElementById("question-text");
    const choicesContainer = document.getElementById("choices-container");
    const choiceButtons = document.querySelectorAll(".btn-choice");
    const clockSvg = document.getElementById("clock-svg");
    const hourHandGroup = document.getElementById("hour-hand-group");
    const hourHand = document.getElementById("hour-hand");
    const minuteHandGroup = document.getElementById("minute-hand-group");
    const minuteHand = document.getElementById("minute-hand");
    const btnCheck = document.getElementById("btn-check");
    const btnHint = document.getElementById("btn-hint");
    const digitalClock = document.getElementById("digital-clock");
    const resultText = document.getElementById("result-text");
    const hintCircle = document.getElementById("hint-circle");

    // 初期起動時の処理
    window.addEventListener("DOMContentLoaded", () => {
        renderAllPokemonList();
        initClockTicks();
        initClockDrag();
        
        btnHome.addEventListener("click", goBackToSelect);
        btnLevelBack.addEventListener("click", () => {
            // レベル選択から相棒選択に戻る
            levelScreen.classList.remove("active");
            selectScreen.classList.add("active");
        });
        btnCheck.addEventListener("click", checkAnswer);
        btnHint.addEventListener("click", toggleHint);

        // ゲーム画面のどこかをタップしたら、間違いメッセージを消す
        gameScreen.addEventListener("click", () => {
            if (resultText.style.display === "block") {
                resultText.style.display = "none";
            }
            if (hintCircle.style.display === "block") {
                hintCircle.style.display = "none";
            }
        });

        // 4択ボタンのクリックイベント
        choiceButtons.forEach(btn => {
            btn.addEventListener("click", (e) => {
                const targetBtn = e.currentTarget;
                const idx = parseInt(targetBtn.getAttribute("data-choice-idx"));
                selectedChoiceIdx = idx;
                
                // 選択表示のトグル
                choiceButtons.forEach(b => b.classList.remove("selected"));
                targetBtn.classList.add("selected");
            });
        });

        // レベルボタンのイベント登録
        const levelButtons = document.querySelectorAll(".btn-level");
        levelButtons.forEach(btn => {
            btn.addEventListener("click", (e) => {
                const targetBtn = e.currentTarget;
                const levelNum = parseInt(targetBtn.getAttribute("data-level"));
                currentLevel = levelNum;
                
                // ヘッダーのセレクトボックスの表示も連動させる
                document.getElementById("level-select").value = currentLevel;
                
                // レベル決定後、ゲーム画面へ移行
                startGameAfterLevelSelect();
            });
        });

        // ヘッダーのレベル選択の変更時に即時に問題へ反映（プレイ中）
        const levelSelect = document.getElementById("level-select");
        levelSelect.addEventListener("change", (e) => {
            currentLevel = parseInt(e.target.value);
            if (selectedPokemon) {
                generateQuestion();
            }
        });
    });

    // ポケモン全員一覧の描画
    function renderAllPokemonList() {
        pokemonGrid.innerHTML = "";
        
        Object.keys(POKEMON_DATA).forEach(genKey => {
            const genStarters = POKEMON_DATA[genKey].starters;
            
            genStarters.forEach(starter => {
                const card = document.createElement("div");
                card.className = `pokemon-card ${starter.type}`;
                
                // 選択画面では「最初の形態 (たね)」を表示して親しみやすくする
                const firstStageId = starter.chain[0];
                const imageUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${firstStageId}.png`;
                
                const badge = document.createElement("span");
                badge.className = `type-badge ${starter.type}`;
                badge.textContent = translateType(starter.type);
                card.appendChild(badge);

                const img = document.createElement("img");
                img.src = imageUrl;
                img.alt = starter.names[0];
                img.loading = "lazy";
                img.onerror = () => {
                    img.src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/0.png";
                };
                card.appendChild(img);

                const nameDiv = document.createElement("div");
                nameDiv.className = "pokemon-name";
                nameDiv.textContent = starter.names[0];
                card.appendChild(nameDiv);

                card.addEventListener("click", () => {
                    selectedPokemon = {
                        type: starter.type,
                        chain: starter.chain,
                        names: starter.names,
                        currentStage: 1 // ★スタートは中間形態（ピカチュウ等）からにする！
                    };
                    showLevelSelect();
                });

                pokemonGrid.appendChild(card);
            });
        });
    }

    function translateType(type) {
        switch (type) {
            case "grass": return "くさ";
            case "fire": return "ほのお";
            case "water": return "みず";
            case "electric": return "でんき";
            default: return "ノーマル";
        }
    }

    // レベル選択画面の表示
    function showLevelSelect() {
        if (!selectedPokemon) return;
        
        const firstStageId = selectedPokemon.chain[0];
        const imageUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${firstStageId}.png`;
        
        document.getElementById("level-pokemon-img").src = imageUrl;
        document.getElementById("level-pokemon-name").textContent = selectedPokemon.names[0];
        
        selectScreen.classList.remove("active");
        levelScreen.classList.add("active");
        
        // AudioContextの初期化
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    // レベル選択後のゲーム開始
    function startGameAfterLevelSelect() {
        levelScreen.classList.remove("active");
        gameScreen.classList.add("active");
        btnHome.style.display = "block";
        
        // ヘッダーのレベル選択を表示する
        document.querySelector(".level-select-container").style.display = "flex";
        
        gameState = "neutral";
        updatePokemonDisplay();
        
        accumulatedMinutes = 720;
        updateClockHands();
        
        generateQuestion();
    }

    // 選択画面へもどる
    function goBackToSelect() {
        gameScreen.classList.remove("active");
        selectScreen.classList.add("active");
        btnHome.style.display = "none";
        
        // ヘッダーのレベル選択を非表示にする
        document.querySelector(".level-select-container").style.display = "none";
        
        hideHint();
    }

    // ポケモンのグラフィックとラベルを更新
    function updatePokemonDisplay(animType) {
        if (!selectedPokemon) return;
        
        const pokemonId = selectedPokemon.chain[selectedPokemon.currentStage];
        const pokemonName = selectedPokemon.names[selectedPokemon.currentStage];
        
        // 最初のお題 (gameState === "neutral") ではモンスターボールを表示し、ポケモン名は隠す
        if (gameState === "neutral") {
            pokeballSvg.style.display = "block";
            pokemonImg.style.display = "none";
            pokemonNameLabel.textContent = "だれが でるかな？";
            
            // 揺れクラスをリセット
            pokeballSvg.classList.remove("pokeball-shake-anim");
        } else {
            pokeballSvg.style.display = "none";
            pokemonImg.style.display = "block";
            pokemonImg.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${pokemonId}.png`;
            pokemonNameLabel.textContent = pokemonName;

            if (animType === "evolve") {
                pokemonImg.classList.remove("evolve-anim", "devolve-anim");
                void pokemonImg.offsetWidth;
                pokemonImg.classList.add("evolve-anim");
            } else if (animType === "devolve") {
                pokemonImg.classList.remove("evolve-anim", "devolve-anim");
                void pokemonImg.offsetWidth;
                pokemonImg.classList.add("devolve-anim");
            }
        }
    }

    // 鳴き声の再生
    function playPokemonCry() {
        if (!selectedPokemon) return;
        const pokemonId = selectedPokemon.chain[selectedPokemon.currentStage];
        
        const cryUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/cries/${pokemonId}.ogg`;
        const audio = new Audio(cryUrl);
        audio.volume = 0.5;
        audio.play().catch(e => {
            console.log("鳴き声の再生に失敗しました: ", e);
        });
    }

    // 薄い「ゴースト針（基準時刻）」の更新
    function updateGhostHands(hour, minute) {
        const ghostHands = document.getElementById("ghost-hands");
        if (gameState === "neutral") {
            ghostHands.style.display = "none";
            return;
        }
        ghostHands.style.display = "block";
        
        const totalMinutes = ((hour % 12) * 60 + minute) % 720;
        
        // ゴースト短針の回転角度
        const hourAngle = totalMinutes * 0.5;
        document.getElementById("ghost-hour-hand").setAttribute("transform", `rotate(${hourAngle}, 200, 200)`);
        
        // ゴースト長針の回転角度
        const minuteAngle = minute * 6;
        document.getElementById("ghost-minute-hand").setAttribute("transform", `rotate(${minuteAngle}, 200, 200)`);
    }

    // 問題の生成
    function generateQuestion() {
        hideHint();
        
        const currentName = selectedPokemon.names[selectedPokemon.currentStage];

        if (gameState === "neutral") {
            // 最初の時刻合わせ
            targetHour = Math.floor(Math.random() * 12) + 1;
            
            // レベルに応じた分の生成
            if (currentLevel === 1) {
                targetMinute = 0;
            } else if (currentLevel === 2 || currentLevel === 3 || currentLevel === 6) {
                const minutes = [0, 15, 30, 45];
                targetMinute = minutes[Math.floor(Math.random() * minutes.length)];
            } else if (currentLevel === 4 || currentLevel === 7) {
                targetMinute = Math.floor(Math.random() * 12) * 5;
            } else {
                targetMinute = Math.floor(Math.random() * 60);
            }
            
            const minuteStr = targetMinute === 0 ? "ちょうど" : `${targetMinute}ふん`;
            
            questionText.innerHTML = `${currentName}に あいたいな！<br>とけいの はりを <span style="color:var(--accent-color); font-size:28px;">${targetHour}じ ${minuteStr}</span> に あわせてね！`;
            
            // 基準時間合わせのときはゴースト針を非表示にする
            updateGhostHands();
        } 
        else if (gameState === "advance") {
            // 進める問題 (進化)
            let diffHour = 0;
            let diffMinute = 0;
            
            // 1. レベル別の増分とベース分の決定
            if (currentLevel === 1) {
                // レベル1: ちょうど単位
                diffHour = Math.floor(Math.random() * 3) + 1;
                diffMinute = 0;
                baseMinute = 0;
            } 
            else if (currentLevel === 2) {
                // レベル2: 30分刻み・繰り上がりなし
                diffHour = Math.floor(Math.random() * 2) + 1;
                diffMinute = Math.random() < 0.5 ? 0 : 30;
                if (diffMinute === 30) {
                    baseMinute = 0; // 0 + 30 = 30 (繰り上がりなし)
                } else {
                    baseMinute = Math.random() < 0.5 ? 0 : 30; // 0+0=0, 30+0=30
                }
            } 
            else if (currentLevel === 3) {
                // レベル3: 15分刻み・繰り上がりなし
                diffHour = Math.floor(Math.random() * 2) + 1;
                const options = [0, 15, 30, 45];
                diffMinute = options[Math.floor(Math.random() * options.length)];
                
                const validBaseMinutes = options.filter(m => m + diffMinute < 60);
                baseMinute = validBaseMinutes[Math.floor(Math.random() * validBaseMinutes.length)];
            } 
            else if (currentLevel === 4) {
                // レベル4: 5分刻み・繰り上がりなし
                diffHour = Math.floor(Math.random() * 2) + 1;
                diffMinute = Math.floor(Math.random() * 12) * 5; // 0〜55
                
                const validBaseMinutes = [];
                for (let m = 0; m < 60; m += 5) {
                    if (m + diffMinute < 60) validBaseMinutes.push(m);
                }
                baseMinute = validBaseMinutes[Math.floor(Math.random() * validBaseMinutes.length)];
            } 
            else if (currentLevel === 5) {
                // レベル5: 1分刻み・繰り上がりなし
                diffHour = Math.floor(Math.random() * 2) + 1;
                diffMinute = Math.floor(Math.random() * 60); // 0〜59
                
                const validBaseMinutes = [];
                for (let m = 0; m < 60; m++) {
                    if (m + diffMinute < 60) validBaseMinutes.push(m);
                }
                baseMinute = validBaseMinutes[Math.floor(Math.random() * validBaseMinutes.length)];
            } 
            else if (currentLevel === 6) {
                // レベル6: 15分刻み・繰り上がりあり！
                diffHour = Math.floor(Math.random() * 2) + 1;
                const options = [15, 30, 45]; // 0分を除外
                diffMinute = options[Math.floor(Math.random() * options.length)];
                
                const allOptions = [0, 15, 30, 45];
                const validBaseMinutes = allOptions.filter(m => m + diffMinute >= 60);
                baseMinute = validBaseMinutes[Math.floor(Math.random() * validBaseMinutes.length)];
            } 
            else if (currentLevel === 7) {
                // レベル7: 5分刻み・繰り上がりあり！
                diffHour = Math.floor(Math.random() * 2) + 1;
                diffMinute = (Math.floor(Math.random() * 11) + 1) * 5; // 5〜55分
                
                const validBaseMinutes = [];
                for (let m = 0; m < 60; m += 5) {
                    if (m + diffMinute >= 60) validBaseMinutes.push(m);
                }
                baseMinute = validBaseMinutes[Math.floor(Math.random() * validBaseMinutes.length)];
            } 
            else if (currentLevel === 8) {
                // レベル8: 1分刻み・繰り上がりあり！
                diffHour = Math.floor(Math.random() * 2) + 1;
                diffMinute = Math.floor(Math.random() * 59) + 1; // 1〜59分
                
                const validBaseMinutes = [];
                for (let m = 0; m < 60; m++) {
                    if (m + diffMinute >= 60) validBaseMinutes.push(m);
                }
                baseMinute = validBaseMinutes[Math.floor(Math.random() * validBaseMinutes.length)];
            }

            // ベース時をランダムに決定
            baseHour = Math.floor(Math.random() * 12) + 1;
            
            // 表示と針の位置をベース時間に強制セット
            accumulatedMinutes = (baseHour % 12) * 60 + baseMinute;
            updateClockHands();
            updateGhostHands(baseHour, baseMinute);
            
            // 目標時刻の計算
            let totalMin = (baseHour * 60 + baseMinute) + (diffHour * 60 + diffMinute);
            let targetTotalMin = totalMin % 720;
            targetHour = Math.floor(targetTotalMin / 60) === 0 ? 12 : Math.floor(targetTotalMin / 60);
            targetMinute = targetTotalMin % 60;
            
            let timeStr = "";
            if (diffHour > 0) timeStr += `${diffHour}じかん`;
            if (diffMinute > 0) {
                timeStr += ` ${diffMinute}ぷん`;
            }
            
            const nextPokemonName = selectedPokemon.names[selectedPokemon.currentStage + 1];
            const baseMinStr = baseMinute === 0 ? "ちょうど" : `${baseMinute}ふん`;
            
            questionText.innerHTML = `いまの じかん【<span style="color:var(--primary-color); font-size:26px;">${baseHour}じ ${baseMinStr}</span>】（うすいはり）から<br><span style="color:var(--accent-color); font-size:28px;">${timeStr}ご</span> に <span style="color:var(--grass-color); font-weight:bold;">${nextPokemonName}</span> に しんか するよ！<br>その じかんに あわせてね！`;
        } 
        else if (gameState === "regress") {
            // 戻す問題 (退化)
            const prevPokemonName = selectedPokemon.names[0]; // 常に第1形態の名前を表示（サイクル: stage2→stage0）
            let diffHour = 0;
            let diffMinute = 0;
            
            // 1. レベル別の増分とベース分の決定
            if (currentLevel === 1) {
                // レベル1: ちょうど単位
                diffHour = Math.floor(Math.random() * 3) + 1;
                diffMinute = 0;
                baseMinute = 0;
            } 
            else if (currentLevel === 2) {
                // レベル2: 30分刻み・繰り下がりなし
                diffHour = Math.floor(Math.random() * 2) + 1;
                diffMinute = Math.random() < 0.5 ? 0 : 30;
                if (diffMinute === 30) {
                    baseMinute = 30; // 30 - 30 = 0 (繰り下がりなし)
                } else {
                    baseMinute = Math.random() < 0.5 ? 0 : 30;
                }
            } 
            else if (currentLevel === 3) {
                // レベル3: 15分刻み・繰り下がりなし
                diffHour = Math.floor(Math.random() * 2) + 1;
                const options = [0, 15, 30, 45];
                diffMinute = options[Math.floor(Math.random() * options.length)];
                
                const validBaseMinutes = options.filter(m => m >= diffMinute);
                baseMinute = validBaseMinutes[Math.floor(Math.random() * validBaseMinutes.length)];
            } 
            else if (currentLevel === 4) {
                // レベル4: 5分刻み・繰り下がりなし
                diffHour = Math.floor(Math.random() * 2) + 1;
                diffMinute = Math.floor(Math.random() * 12) * 5;
                
                const validBaseMinutes = [];
                for (let m = 0; m < 60; m += 5) {
                    if (m >= diffMinute) validBaseMinutes.push(m);
                }
                baseMinute = validBaseMinutes[Math.floor(Math.random() * validBaseMinutes.length)];
            } 
            else if (currentLevel === 5) {
                // レベル5: 1分刻み・繰り下がりなし
                diffHour = Math.floor(Math.random() * 2) + 1;
                diffMinute = Math.floor(Math.random() * 60);
                
                const validBaseMinutes = [];
                for (let m = 0; m < 60; m++) {
                    if (m >= diffMinute) validBaseMinutes.push(m);
                }
                baseMinute = validBaseMinutes[Math.floor(Math.random() * validBaseMinutes.length)];
            } 
            else if (currentLevel === 6) {
                // レベル6: 15分刻み・繰り下がりあり！
                diffHour = Math.floor(Math.random() * 2) + 1;
                const options = [15, 30, 45];
                diffMinute = options[Math.floor(Math.random() * options.length)];
                
                const allOptions = [0, 15, 30, 45];
                const validBaseMinutes = allOptions.filter(m => m < diffMinute);
                baseMinute = validBaseMinutes[Math.floor(Math.random() * validBaseMinutes.length)];
            } 
            else if (currentLevel === 7) {
                // レベル7: 5分刻み・繰り下がりあり！
                diffHour = Math.floor(Math.random() * 2) + 1;
                diffMinute = (Math.floor(Math.random() * 11) + 1) * 5;
                
                const validBaseMinutes = [];
                for (let m = 0; m < 60; m += 5) {
                    if (m < diffMinute) validBaseMinutes.push(m);
                }
                baseMinute = validBaseMinutes[Math.floor(Math.random() * validBaseMinutes.length)];
            } 
            else if (currentLevel === 8) {
                // レベル8: 1分刻み・繰り下がりあり！
                diffHour = Math.floor(Math.random() * 2) + 1;
                diffMinute = Math.floor(Math.random() * 59) + 1;
                
                const validBaseMinutes = [];
                for (let m = 0; m < 60; m++) {
                    if (m < diffMinute) validBaseMinutes.push(m);
                }
                baseMinute = validBaseMinutes[Math.floor(Math.random() * validBaseMinutes.length)];
            }

            // ベース時をランダムに決定
            baseHour = Math.floor(Math.random() * 12) + 1;
            
            // 表示と針の位置をベース時間に強制セット
            accumulatedMinutes = (baseHour % 12) * 60 + baseMinute;
            updateClockHands();
            updateGhostHands(baseHour, baseMinute);
            
            // 目標時刻の計算
            let totalMin = (baseHour * 60 + baseMinute) - (diffHour * 60 + diffMinute);
            if (totalMin < 0) totalMin += 720;
            let targetTotalMin = totalMin % 720;
            targetHour = Math.floor(targetTotalMin / 60) === 0 ? 12 : Math.floor(targetTotalMin / 60);
            targetMinute = targetTotalMin % 60;
            
            let timeStr = "";
            if (diffHour > 0) timeStr += `${diffHour}じかん`;
            if (diffMinute > 0) {
                timeStr += ` ${diffMinute}ぷん`;
            }
            
            const baseMinStr = baseMinute === 0 ? "ちょうど" : `${baseMinute}ふん`;
            questionText.innerHTML = `いまの じかん【<span style="color:var(--primary-color); font-size:26px;">${baseHour}じ ${baseMinStr}</span>】（うすいはり）から<br><span style="color:var(--secondary-color); font-size:28px;">${timeStr}まえ</span> は <span style="color:var(--accent-color); font-weight:bold;">${prevPokemonName}</span> だったよ！<br>その じかんに あわせてね！`;
        }
        
        // ポケモンのグラフィックとラベルを表示状態に同期更新
        updatePokemonDisplay();

        // 最初のお題（gameState === "neutral"）では4択は不要なので非表示にし、それ以降の問題で表示する
        if (gameState === "neutral") {
            choicesContainer.style.display = "none";
        } else {
            choicesContainer.style.display = "block";
            setupChoices();
        }
    }

    // 答え合わせ (中間形態スタートの進化・退化ループ ＋ 4択＆針のダブルチェック)
    function checkAnswer() {
        // 判定の前に浮動小数点のズレを綺麗に四捨五入して整数（分）にスナップ！
        accumulatedMinutes = Math.round(accumulatedMinutes);
        updateClockHands();

        // 最初の問題 (ひたすら指定時間に針を合わせる) の答え合わせ
        if (gameState === "neutral") {
            const isClockCorrect = displayHour === targetHour && displayMinute === targetMinute;
            
            if (isClockCorrect) {
                // モンスターボールを激しく揺らす！
                pokeballSvg.classList.remove("pokeball-shake-anim");
                void pokeballSvg.offsetWidth; // リフロー
                pokeballSvg.classList.add("pokeball-shake-anim");
                
                // 揺れが終わったタイミング (0.9秒後) でポケモン出現！
                setTimeout(() => {
                    pokeballSvg.style.display = "none";
                    pokemonImg.style.display = "block";
                    
                    // 強制的に初期選択ポケモン（ピカチュウ等）を画像とラベルにセット
                    const pokemonId = selectedPokemon.chain[selectedPokemon.currentStage];
                    const pokemonName = selectedPokemon.names[selectedPokemon.currentStage];
                    pokemonImg.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${pokemonId}.png`;
                    pokemonNameLabel.textContent = pokemonName;
                    
                    // 出現ポップアニメーション
                    pokemonImg.classList.remove("evolve-anim", "devolve-anim");
                    void pokemonImg.offsetWidth;
                    pokemonImg.classList.add("evolve-anim");
                    
                    // 鳴き声と紙吹雪エフェクトを同時に再生！
                    playPokemonCry();
                    triggerSuccessEffect();
                }, 900);
                
                setTimeout(() => {
                    // 固定サイクル: neutral → 必ず advance (進める)
                    gameState = "advance";
                    generateQuestion();
                }, 3400);
            } else {
                playFailureTone();
                resultText.innerHTML = "とけいの はり を よくみて、ぴったり あわせてね！";
                resultText.style.display = "block";
                resultText.style.color = "var(--secondary-color)";
                
                hintCircle.style.display = "block";
                setTimeout(() => {
                    hintCircle.style.display = "none";
                }, 2000);
            }
            return;
        }

        // 2問目以降（進める・戻す）の答え合わせ (4択＆針のダブルチェック)
        // 1. 4択が選ばれているかチェック
        if (selectedChoiceIdx === null) {
            resultText.innerHTML = "なにじ なにぷんか、４つの なかから えらんでね！";
            resultText.style.display = "block";
            resultText.style.color = "var(--secondary-color)";
            playFailureTone();
            return;
        }

        // 2. 選択された4択の答えが正しいか
        const chosen = currentChoices[selectedChoiceIdx];
        const isChoiceCorrect = chosen.hour === targetHour && chosen.minute === targetMinute;

        // 3. 時計の針が正しいか
        const isClockCorrect = displayHour === targetHour && displayMinute === targetMinute;

        // 両方正解ならクリア！
        if (isChoiceCorrect && isClockCorrect) {
            triggerSuccessEffect();
            playPokemonCry();
            
            setTimeout(() => {
                // 固定サイクル: neutral → advance → regress → neutral → ...
                if (gameState === "advance") {
                    // advance正解: stage 1→2 (中間→最終形態へ進化)
                    selectedPokemon.currentStage = 2;
                    updatePokemonDisplay("evolve");
                    playSuccessSound();
                    gameState = "regress"; // 次は戻す問題
                } 
                else if (gameState === "regress") {
                    // regress正解: stage 2→0 (最終形態→第1形態へ退化)
                    selectedPokemon.currentStage = 0;
                    updatePokemonDisplay("devolve");
                    playSuccessSound();
                    // 次は再びneutral (時刻合わせ) に戻り、stageも1にリセット
                    gameState = "neutral";
                    selectedPokemon.currentStage = 1;
                }
                
                generateQuestion();
            }, 2500);
        } else {
            // 不正解時の演出と親切なメッセージヒント
            playFailureTone();
            
            let message = "";
            if (!isClockCorrect && isChoiceCorrect) {
                message = "４たくは あっているよ！<br>とけいの はり を よくみて、ぴったり あわせてね！";
                // 針だけ違うので、ヒントサークルを電撃風に点滅させる
                hintCircle.style.display = "block";
                setTimeout(() => {
                    hintCircle.style.display = "none";
                }, 2000);
            } else if (isClockCorrect && !isChoiceCorrect) {
                message = "とけいの はりは あっているよ！<br>４たくの なかから、ただしい じかんを えらびなおしてね！";
            } else {
                message = "とけいの はり も、えらんだ じかん も ちがうみたい！<br>もういちど よく かんがえてみてね！";
            }
            
            resultText.innerHTML = message;
            resultText.style.display = "block";
            resultText.style.color = "var(--secondary-color)";
        }
    }

    // 4択選択肢のセットアップ
    function setupChoices() {
        selectedChoiceIdx = null; // 選択をリセット
        
        // レベルに応じた刻み幅(step)
        let step = 1;
        if (currentLevel === 1) step = 60;
        else if (currentLevel === 2) step = 30;
        else if (currentLevel === 3 || currentLevel === 6) step = 15;
        else if (currentLevel === 4 || currentLevel === 7) step = 5;
        
        const dummies = [];
        let attempts = 0;
        while (dummies.length < 3 && attempts < 100) {
            attempts++;
            let dHour = targetHour;
            let dMinute = targetMinute;
            
            const rand = Math.random();
            if (rand < 0.33) {
                // 時のみ変更
                const offset = (Math.random() < 0.5 ? -1 : 1) * (Math.floor(Math.random() * 3) + 1);
                dHour = ((targetHour - 1 + offset + 12) % 12) + 1;
            } else if (rand < 0.66) {
                // 分のみ変更
                if (step === 60) {
                    const offset = (Math.random() < 0.5 ? -1 : 1) * (Math.floor(Math.random() * 4) + 1);
                    dHour = ((targetHour - 1 + offset + 12) % 12) + 1;
                } else {
                    const offsetSteps = (Math.random() < 0.5 ? -1 : 1) * (Math.floor(Math.random() * 4) + 1);
                    dMinute = (targetMinute + offsetSteps * step + 60) % 60;
                }
            } else {
                // 両方変更
                const offsetHour = (Math.random() < 0.5 ? -1 : 1) * (Math.floor(Math.random() * 2) + 1);
                dHour = ((targetHour - 1 + offsetHour + 12) % 12) + 1;
                
                if (step < 60) {
                    const offsetSteps = (Math.random() < 0.5 ? -1 : 1) * (Math.floor(Math.random() * 3) + 1);
                    dMinute = (targetMinute + offsetSteps * step + 60) % 60;
                }
            }
            
            const isDuplicate = (dHour === targetHour && dMinute === targetMinute) ||
                                dummies.some(d => d.hour === dHour && d.minute === dMinute);
            
            if (!isDuplicate) {
                dummies.push({ hour: dHour, minute: dMinute });
            }
        }
        
        // セーフガード
        while (dummies.length < 3) {
            let dHour = Math.floor(Math.random() * 12) + 1;
            let dMinute = step === 60 ? 0 : (Math.floor(Math.random() * (60 / step)) * step) % 60;
            const isDuplicate = (dHour === targetHour && dMinute === targetMinute) ||
                                dummies.some(d => d.hour === dHour && d.minute === dMinute);
            if (!isDuplicate) {
                dummies.push({ hour: dHour, minute: dMinute });
            }
        }
        
        // 選択肢の配列構築
        const list = [
            { hour: targetHour, minute: targetMinute, isCorrect: true },
            ...dummies.map(d => ({ hour: d.hour, minute: d.minute, isCorrect: false }))
        ];
        
        // シャッフル
        for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [list[i], list[j]] = [list[j], list[i]];
        }
        
        currentChoices = list;
        
        // UIに反映
        choiceButtons.forEach((btn, idx) => {
            const item = currentChoices[idx];
            const minStr = item.minute === 0 ? "ちょうど" : `${item.minute}ぷん`;
            btn.textContent = `${item.hour}じ ${minStr}`;
            btn.classList.remove("selected");
        });
    }

    // 正解時の演出エフェクト

        resultText.textContent = "せいかい！";
        resultText.style.color = "var(--accent-color)";
        resultText.style.display = "block";
        
        for (let i = 0; i < 40; i++) {

        resultText.style.display = "block";

    // ----------------------------------------------------
    // 時計盤の描画およびダブル・ドラッグ操作システム
    // ----------------------------------------------------

    // 時計の目盛りを動的に作成
    function initClockTicks() {
        const ticksGroup = document.getElementById("clock-ticks");
        const numbersGroup = document.getElementById("clock-numbers");
        ticksGroup.innerHTML = "";
        numbersGroup.innerHTML = "";

        for (let i = 0; i < 60; i++) {
            const angle = i * 6;
            const rad = (angle - 90) * Math.PI / 180;
            
            const isFiveMinute = i % 5 === 0;
            const rStart = isFiveMinute ? 155 : 163;
            const rEnd = 170;
            
            const x1 = 200 + rStart * Math.cos(rad);
            const y1 = 200 + rStart * Math.sin(rad);
            const x2 = 200 + rEnd * Math.cos(rad);
            const y2 = 200 + rEnd * Math.sin(rad);

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", x1);
            line.setAttribute("y1", y1);
            line.setAttribute("x2", x2);
            line.setAttribute("y2", y2);
            line.setAttribute("stroke", isFiveMinute ? "#333" : "#aaa");
            line.setAttribute("stroke-width", isFiveMinute ? "4" : "2");
            ticksGroup.appendChild(line);
        }

        for (let num = 1; num <= 12; num++) {
            const angle = num * 30;
            const rad = (angle - 90) * Math.PI / 180;
            const r = 135;
            
            const x = 200 + r * Math.cos(rad);
            const y = 200 + r * Math.sin(rad);

            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", x);
            text.setAttribute("y", y + 10);
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("font-size", "34");
            text.setAttribute("font-weight", "800");
            text.setAttribute("font-family", "'Outfit', sans-serif");
            text.setAttribute("fill", "#2c3e50");
            text.textContent = num;
            numbersGroup.appendChild(text);
        }
    }

    // ドラッグ操作ロジックのバインド
    function initClockDrag() {
        minuteHandGroup.addEventListener("mousedown", (e) => dragStart(e, "minute"));
        minuteHandGroup.addEventListener("touchstart", (e) => dragStart(e, "minute"), { passive: false });

        hourHandGroup.addEventListener("mousedown", (e) => dragStart(e, "hour"));
        hourHandGroup.addEventListener("touchstart", (e) => dragStart(e, "hour"), { passive: false });

        window.addEventListener("mousemove", dragMove);
        window.addEventListener("touchmove", dragMove, { passive: false });

        window.addEventListener("mouseup", dragEnd);
        window.addEventListener("touchend", dragEnd);
    }

    function dragStart(e, handType) {
        e.preventDefault();
        initAudioContext();
        
        isDragging = true;
        activeDragHand = handType;
        document.body.style.cursor = "grabbing";
        
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const rect = clockSvg.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        lastAngle = Math.atan2(clientY - centerY, clientX - centerX) * 180 / Math.PI;
    }

    function dragMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const rect = clockSvg.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        let currentAngle = Math.atan2(clientY - centerY, clientX - centerX) * 180 / Math.PI;
        
        if (activeDragHand === "minute") {
            let dAngle = currentAngle - lastAngle;
            if (dAngle > 180) dAngle -= 360;
            if (dAngle < -180) dAngle += 360;
            
            let dMinutes = dAngle / 6;
            accumulatedMinutes += dMinutes;
            
            if (accumulatedMinutes < 0) accumulatedMinutes += 720;
            accumulatedMinutes = accumulatedMinutes % 720;
            
            updateClockHands();
            lastAngle = currentAngle;
        } 
        else if (activeDragHand === "hour") {
            let relativeAngle = currentAngle + 90;
            if (relativeAngle < 0) relativeAngle += 360;
            if (relativeAngle >= 360) relativeAngle -= 360;
            
            let h = Math.round(relativeAngle / 30);
            if (h === 0) h = 12;
            if (h > 12) h = 12;
            
            if (h !== displayHour) {
                playTickSound();
            }
            
            accumulatedMinutes = (h % 12) * 60 + displayMinute;
            
            updateClockHands();
        }
    }

    function dragEnd() {
        if (isDragging) {
            isDragging = false;
            activeDragHand = null;
            document.body.style.cursor = "default";
            
            accumulatedMinutes = Math.round(accumulatedMinutes);
            updateClockHands();
            playTickSound();
        }
    }

    // 長針と短針の位置更新
    function updateClockHands() {
        const totalMinutes = (Math.round(accumulatedMinutes) + 720) % 720;
        
        displayHour = Math.floor(totalMinutes / 60);
        if (displayHour === 0) displayHour = 12;
        displayMinute = totalMinutes % 60;
        
        const minuteAngle = displayMinute * 6;
        minuteHandGroup.setAttribute("transform", `rotate(${minuteAngle}, 200, 200)`);
        
        const hourAngle = (totalMinutes % 720) * 0.5;
        hourHandGroup.setAttribute("transform", `rotate(${hourAngle}, 200, 200)`);
    }

    // ----------------------------------------------------
    // サウンドシステム (Web Audio API)
    // ----------------------------------------------------
    function initAudioContext() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playTickSound() {
        if (!audioContext) return;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        
        osc.type = "sine";
        osc.frequency.setValueAtTime(800, audioContext.currentTime);
        
        gain.gain.setValueAtTime(0.05, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.05);
        
        osc.start();
        osc.stop(audioContext.currentTime + 0.05);
    }

    function playSuccessTone() {
        if (!audioContext) return;
        const now = audioContext.currentTime;
        playTone(523.25, now, 0.1);      // C5
        playTone(659.25, now + 0.1, 0.1);  // E5
        playTone(783.99, now + 0.2, 0.15); // G5
        playTone(1046.50, now + 0.35, 0.3); // C6
    }

    function playFailureTone() {
        if (!audioContext) return;
        const now = audioContext.currentTime;
        playTone(293.66, now, 0.15);      // D4
        playTone(220.00, now + 0.15, 0.3); // A3
    }

    function playSuccessSound() {
        if (!audioContext) return;
        const now = audioContext.currentTime;
        for (let i = 0; i < 8; i++) {
            playTone(800 + i * 150, now + i * 0.08, 0.08);
        }
    }

    function playTone(freq, startTime, duration) {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, startTime);
        
        gain.gain.setValueAtTime(0.1, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        
        osc.start(startTime);
        osc.stop(startTime + duration);
    }
</script>
