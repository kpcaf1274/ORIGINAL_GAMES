<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web OK Play - Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --cell-size: 44px;
            --board-size: 40;
            
            --player-1: #ff4757; /* Red */
            --player-2: #1e90ff; /* Blue */
            --player-3: #ffd32a; /* Yellow */
            --player-4: #2ed573; /* Green */
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- UI Overlay --- */
        #ui-panel {
            padding: 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        #setup-screen h1 {
            font-size: 2.5rem;
            margin: 0 0 8px 0;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        #setup-screen p {
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #game-screen {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        #status-message {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 4px;
            transition: color 0.3s ease;
        }

        #sub-message {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 16px;
        }

        .action-button {
            padding: 8px 16px;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.3);
        }

        #undo-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        /* --- Game Board --- */
        #board-container {
            flex-grow: 1;
            overflow: auto;
            position: relative;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            scrollbar-width: none; /* Hide scrollbar Firefox */
        }
        
        #board-container::-webkit-scrollbar {
            display: none; /* Hide scrollbar Chrome/Safari */
        }

        #board {
            display: grid;
            grid-template-columns: repeat(var(--board-size), var(--cell-size));
            grid-template-rows: repeat(var(--board-size), var(--cell-size));
            gap: 2px;
            background: rgba(255, 255, 255, 0.02);
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.05);
            z-index: 2;
        }

        /* Tile Styles */
        .piece {
            width: 85%;
            height: 85%;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            animation: placeAnimate 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .piece::before {
            content: '';
            position: absolute;
            inset: 2px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 6px;
        }

        .player-1 .piece { background: var(--player-1); background: linear-gradient(135deg, #ff4757, #ff6b81); }
        .player-2 .piece { background: var(--player-2); background: linear-gradient(135deg, #1e90ff, #70a1ff); }
        .player-3 .piece { background: var(--player-3); background: linear-gradient(135deg, #ffd32a, #fffa65); }
        .player-4 .piece { background: var(--player-4); background: linear-gradient(135deg, #2ed573, #7bed9f); }

        .selected {
            transform: scale(1.1);
            z-index: 10;
        }
        
        .selected .piece {
            filter: brightness(1.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            outline: 3px solid white;
        }

        .victory {
            animation: victoryPulse 1.5s infinite;
            z-index: 100;
        }

        @keyframes placeAnimate {
            from { transform: scale(0) rotate(-10deg); opacity: 0; }
            to { transform: scale(1) rotate(0); opacity: 1; }
        }

        @keyframes victoryPulse {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.2); filter: brightness(1.5); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .invalid-island { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            :root { --cell-size: 38px; }
            #setup-screen h1 { font-size: 1.8rem; }
            #ui-panel { padding: 16px; }
            button { padding: 10px 18px; font-size: 14px; }
        }
    </style>
</head>

<body>

    <div id="ui-panel">
        <div id="setup-screen">
            <h1>OK PLAY</h1>
            <p>Select number of players</p>
            <div class="btn-group">
                <button onclick="startGame(2)">2 Players</button>
                <button onclick="startGame(3)">3 Players</button>
                <button onclick="startGame(4)">4 Players</button>
            </div>
        </div>

        <div id="game-screen">
            <div id="status-message">Player 1's Turn</div>
            <div id="sub-message">Tiles left: 15</div>
            <div class="btn-group">
                <button class="action-button" id="undo-button" onclick="undoMove()" disabled>↩ UNDO</button>
                <button class="action-button" onclick="resetGame()">RESET GAME</button>
            </div>
        </div>
    </div>

    <div id="board-container">
        <div id="board"></div>
    </div>

    <script>
        // --- Audio Manager (Web Audio API) ---
        const AudioManager = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            play(freq, type, duration, volume = 0.1) {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            playPlace() { this.play(400, 'sine', 0.1, 0.2); },
            playSelect() { this.play(600, 'triangle', 0.15, 0.1); },
            playError() { 
                this.play(100, 'sawtooth', 0.3, 0.1);
                this.play(150, 'sawtooth', 0.3, 0.1); 
            },
            playWin() {
                const now = this.ctx ? this.ctx.currentTime : 0;
                [440, 554.37, 659.25, 880].forEach((f, i) => {
                    setTimeout(() => this.play(f, 'sine', 0.5, 0.2), i * 150);
                });
            },
            playUndo() { this.play(300, 'triangle', 0.2, 0.15); }
        };

        // --- Game Logic ---
        const BOARD_SIZE = 40;
        const WIN_COUNT = 5;
        let board = [];
        let players = [];
        let currentPlayerIndex = 0;
        let totalPiecesPlaced = 0;
        let selectedPiece = null;
        let isGameOver = false;
        let history = []; // Undo stack

        function saveState() {
            history.push({
                board: board.map(row => [...row]),
                players: players.map(p => ({ ...p })),
                currentPlayerIndex,
                totalPiecesPlaced,
                isGameOver
            });
            document.getElementById('undo-button').disabled = false;
        }

        function undoMove() {
            if (history.length === 0) return;
            AudioManager.playUndo();
            // Snapshot current board before restore for diff
            const prevBoard = board.map(row => [...row]);
            const prev = history.pop();
            board = prev.board;
            players = prev.players;
            currentPlayerIndex = prev.currentPlayerIndex;
            totalPiecesPlaced = prev.totalPiecesPlaced;
            isGameOver = prev.isGameOver;
            selectedPiece = null;
            if (history.length === 0) {
                document.getElementById('undo-button').disabled = true;
            }
            // Diff render: only update cells that actually changed
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (prevBoard[r][c] !== board[r][c]) {
                        updateBoardCell(r, c);
                    }
                }
            }
            updateUI();
        }

        const colors = [
            { id: 1, name: "Red", code: "#ff4757" },
            { id: 2, name: "Blue", code: "#1e90ff" },
            { id: 3, name: "Yellow", code: "#ffd32a" },
            { id: 4, name: "Green", code: "#2ed573" }
        ];

        function startGame(numPlayers) {
            AudioManager.init();
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            const pieceCount = (numPlayers === 3) ? 12 : 15;
            players = [];
            for (let i = 0; i < numPlayers; i++) {
                players.push({
                    ...colors[i],
                    piecesLeft: pieceCount,
                });
            }

            board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
            currentPlayerIndex = 0;
            totalPiecesPlaced = 0;
            selectedPiece = null;
            isGameOver = false;
            history = [];
            document.getElementById('undo-button').disabled = true;

            renderBoard();
            updateUI();

            // Center Board
            setTimeout(() => {
                const container = document.getElementById('board-container');
                const boardEl = document.getElementById('board');
                container.scrollTop = (boardEl.clientHeight - container.clientHeight) / 2;
                container.scrollLeft = (boardEl.clientWidth - container.clientWidth) / 2;
            }, 100);
        }

        function resetGame() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'block';
            document.getElementById('board').innerHTML = '';
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${r}-${c}`;
                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardEl.appendChild(cell);
                    if (board[r][c] > 0) updateBoardCell(r, c);
                }
            }
        }

        function updateBoardCell(r, c, isVictory = false) {
            const cell = document.getElementById(`cell-${r}-${c}`);
            cell.innerHTML = '';
            cell.className = 'cell';
            
            if (board[r][c] > 0) {
                cell.classList.add(`player-${board[r][c]}`);
                const piece = document.createElement('div');
                piece.className = 'piece';
                if (isVictory) piece.classList.add('victory');
                cell.appendChild(piece);
            }
            
            if (selectedPiece && selectedPiece.r === r && selectedPiece.c === c) {
                cell.classList.add('selected');
            }
        }

        function updateUI() {
            if (isGameOver) return;
            const p = players[currentPlayerIndex];
            const statusEl = document.getElementById('status-message');
            const subEl = document.getElementById('sub-message');

            statusEl.textContent = `${p.name}'s Turn`;
            statusEl.style.color = p.code;

            if (p.piecesLeft > 0) {
                subEl.textContent = `Tiles left: ${p.piecesLeft}`;
            } else {
                subEl.textContent = selectedPiece
                    ? "Select an empty spot nearby"
                    : "Select one of your tiles to move it";
            }
        }

        function handleCellClick(r, c) {
            if (isGameOver) return;
            const player = players[currentPlayerIndex];

            // Phase 1: Placing new tiles
            if (player.piecesLeft > 0) {
                if (board[r][c] !== 0) return;
                if (totalPiecesPlaced === 0 || hasAdjacentEdge(r, c, -1, -1)) {
                    saveState();
                    AudioManager.playPlace();
                    placePiece(r, c, player);
                } else {
                    AudioManager.playError();
                }
                return;
            }

            // Phase 2: Moving existing tiles
            if (board[r][c] === player.id) {
                if (!isGraphConnected(r, c)) {
                    document.getElementById(`cell-${r}-${c}`).classList.add('invalid-island');
                    setTimeout(() => document.getElementById(`cell-${r}-${c}`).classList.remove('invalid-island'), 400);
                    AudioManager.playError();
                    return;
                }

                AudioManager.playSelect();
                const prevSel = selectedPiece;
                selectedPiece = (prevSel && prevSel.r === r && prevSel.c === c) ? null : { r, c };

                if (prevSel) updateBoardCell(prevSel.r, prevSel.c);
                updateBoardCell(r, c);
                updateUI();
                return;
            }

            if (board[r][c] === 0 && selectedPiece) {
                if (hasAdjacentEdge(r, c, selectedPiece.r, selectedPiece.c)) {
                    saveState();
                    AudioManager.playPlace();
                    const oldR = selectedPiece.r;
                    const oldC = selectedPiece.c;
                    board[oldR][oldC] = 0;
                    updateBoardCell(oldR, oldC);
                    selectedPiece = null;
                    placePiece(r, c, player);
                } else {
                    AudioManager.playError();
                }
            }
        }

        function placePiece(r, c, player) {
            board[r][c] = player.id;
            updateBoardCell(r, c);

            if (player.piecesLeft > 0) {
                player.piecesLeft--;
                totalPiecesPlaced++;
            }

            const winPath = checkWin(r, c, player.id);
            if (winPath) {
                document.getElementById('status-message').textContent = `🎉 ${player.name} WINS! 🎉`;
                document.getElementById('sub-message').textContent = "Excellent game!";
                isGameOver = true;
                AudioManager.playWin();
                winPath.forEach(pos => updateBoardCell(pos.r, pos.c, true));
                return;
            }

            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            updateUI();
        }

        function hasAdjacentEdge(r, c, ignoreR, ignoreC) {
            const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
            for (let d of dirs) {
                const nr = r + d[0], nc = c + d[1];
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                    if (board[nr][nc] > 0 && !(nr === ignoreR && nc === ignoreC)) return true;
                }
            }
            return false;
        }

        function checkWin(r, c, playerId) {
            const directions = [
                [[0, 1], [0, -1]],  // Horizontal
                [[1, 0], [-1, 0]],  // Vertical
                [[1, 1], [-1, -1]], // Diagonal \
                [[1, -1], [-1, 1]]  // Diagonal /
            ];

            for (let axis of directions) {
                let count = 1;
                let path = [{r, c}];
                for (let dir of axis) {
                    let nr = r + dir[0];
                    let nc = c + dir[1];
                    while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === playerId) {
                        count++;
                        path.push({r: nr, c: nc});
                        nr += dir[0];
                        nc += dir[1];
                    }
                }
                if (count >= WIN_COUNT) return path;
            }
            return null;
        }

        function isGraphConnected(ignoreR, ignoreC) {
            let firstNode = null;
            let totalPieces = 0;

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] > 0 && !(r === ignoreR && c === ignoreC)) {
                        totalPieces++;
                        if (!firstNode) firstNode = { r, c };
                    }
                }
            }

            if (totalPieces <= 1) return true;

            let visited = new Set();
            let queue = [firstNode];
            visited.add(`${firstNode.r},${firstNode.c}`);
            let visitedCount = 0;

            const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];

            while (queue.length > 0) {
                let curr = queue.shift();
                visitedCount++;

                for (let d of dirs) {
                    let nr = curr.r + d[0];
                    let nc = curr.c + d[1];
                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                        if (board[nr][nc] > 0 && !(nr === ignoreR && nc === ignoreC)) {
                            let key = `${nr},${nc}`;
                            if (!visited.has(key)) {
                                visited.add(key);
                                queue.push({ r: nr, c: nc });
                            }
                        }
                    }
                }
            }
            return visitedCount === totalPieces;
        }
    </script>
</body>

</html>
