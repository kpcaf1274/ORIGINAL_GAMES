    <style>
:root {
    --bg-color: #05050A;
    --panel-bg: rgba(15, 20, 30, 0.65);
    --border-color: rgba(0, 255, 255, 0.3);
    --text-main: #0ff;
    --text-muted: #088;
    --hud-highlight: #f0f;
    --gold: #ff0;
    
    --btn-bg: rgba(0, 40, 60, 0.5);
    --btn-bg-hover: rgba(0, 255, 255, 0.2);
    --btn-border: rgba(0, 255, 255, 0.5);
    --btn-active: rgba(0, 255, 255, 0.8);
    
    /* UI chrome uses a clean system sans-serif (no CRT/brown-tube look).
       The in-canvas roguelike rendering still uses a monospace — see the
       canvas Graphics polyfill constructor. */
    --font-ui: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
    --font-game: 'SF Mono', 'Consolas', 'MS Gothic', 'Osaka', monospace;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

#game-container {
    width: 100%;
    max-width: 500px;
    height: 100%;
    max-height: 900px;
    display: flex;
    flex-direction: column;
    position: relative;
    background: radial-gradient(circle at center, #111e25 0%, #05050A 100%);
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
}

/* (CRT scanline overlay removed — it gave the whole UI a brown-tube look.) */

/* Game row: [left help] [canvas] [right help]. Canvas takes remaining
   vertical space in the container; rails stay narrow (tap-target size)
   so the playfield gets the full height. */
#game-row {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: stretch;
    gap: 6px;
    padding: 4px;
    z-index: 1;
}

/* Side help rails: 2-column grid of [chip][short-label]. Kept tight so
   the canvas can have as much width as possible. */
.help-rail {
    flex: 0 0 46px;
    display: grid;
    grid-template-columns: auto 1fr;
    align-content: center;
    align-items: center;
    gap: 3px 2px;
    color: #bfd;
    font-family: var(--font-ui);
    font-size: 10px;
    line-height: 1.1;
    padding: 2px 0;
}
.help-rail .k {
    display: inline-block;
    min-width: 1.2em;
    padding: 1px 2px;
    text-align: center;
    color: #000;
    background: rgba(150, 230, 255, 0.85);
    border-radius: 2px;
    font-weight: 600;
    font-size: 9px;
    line-height: 1.1;
}
.help-rail .d {
    color: #bfd;
    white-space: nowrap;
    font-size: 10px;
}

/* Game Screen — fill the row center */
#screen-container {
    flex: 1;
    min-width: 0;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background-color: #000;
    z-index: 1;
}

#game-canvas {
    image-rendering: pixelated;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

#overlay-menu {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 20;
    padding: 20px;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
}

#overlay-menu.hidden {
    display: none;
}

#menu-list {
    list-style: none;
    color: #fff;
    font-family: var(--font-game);
    font-size: 16px;
    overflow-y: auto;
}

#menu-list li {
    padding: 10px;
    border-bottom: 1px solid #333;
    cursor: pointer;
}
#menu-list li:hover, #menu-list li.selected {
    background: rgba(0, 255, 255, 0.2);
    color: #0ff;
    text-shadow: 0 0 5px #0ff;
}

/* Standard HUD */
#hud {
    flex: 0 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    background: var(--panel-bg);
    border-top: 1px solid var(--border-color);
    border-bottom: 1px solid var(--border-color);
    padding: 0 5px;
    font-size: 12px;
    font-weight: bold;
    z-index: 2;
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
}

.hud-item {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.hud-label {
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.hud-val {
    color: #fff;
}
#val-hp   { color: #4f4; }
#val-str  { color: #f93; }
#val-gold { color: var(--gold); }

/* Virtual Keyboard */
#virtual-keyboard {
    /* 6 rows (softkeys + numpad 4 rows + run). Grow with content so the
       extra rows don't shrink the 3x4 numpad's tap targets. */
    flex: 0 0 auto;
    background: var(--panel-bg);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 2;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.vk-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    min-height: 42px;
}
/* Numpad rows stay comfortably tall; softkey + run rows are a bit shorter
   so the keypad fits inside typical mobile viewports. */
.vk-row-soft, .vk-row-run { min-height: 36px; }

.vk-btn {
    flex: 1;
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 8px;
    color: var(--text-main);
    font-size: 20px;
    font-family: var(--font-ui);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.1), 0 2px 5px rgba(0,0,0,0.5);
    transition: all 0.1s;
    position: relative;
    overflow: hidden;
    padding: 0;
}
/* Softkeys / run / OK are labeled with kanji or double-arrows; give them a
   slightly smaller font so they don't wrap. */
.vk-soft, .vk-run, .vk-ok { font-size: 14px; }

/* Glass effect highlight */
.vk-btn::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 30%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
    pointer-events: none;
}

.vk-btn:active, .vk-btn.active {
    background: var(--btn-active);
    color: #000;
    transform: scale(0.95);
    box-shadow: 0 0 15px var(--text-main);
}

.vk-action {
    color: var(--hud-highlight);
    border-color: rgba(255, 0, 255, 0.5);
}
.vk-action:active, .vk-action.active {
    background: var(--hud-highlight);
    box-shadow: 0 0 15px var(--hud-highlight);
}

.vk-sys {
    color: var(--gold);
    border-color: rgba(255, 255, 0, 0.5);
}
.vk-sys:active, .vk-sys.active {
    background: var(--gold);
    box-shadow: 0 0 15px var(--gold);
}

/* Softkey 1 / 2 (MAP / MSG) — muted gold, marked as informational. */
.vk-soft {
    color: var(--gold);
    border-color: rgba(255, 220, 100, 0.45);
}
.vk-soft:active, .vk-soft.active {
    background: var(--gold);
    color: #000;
    box-shadow: 0 0 15px var(--gold);
}

/* OK = 決定: pick up item / descend stairs. Same accent as the center "5". */
.vk-ok {
    color: var(--hud-highlight);
    border-color: rgba(255, 0, 255, 0.5);
}
.vk-ok:active, .vk-ok.active {
    background: var(--hud-highlight);
    color: #000;
    box-shadow: 0 0 15px var(--hud-highlight);
}

/* Run arrows: auto-travel. Cyan-tinted to distinguish from single-step. */
.vk-run {
    color: #9ef;
    border-color: rgba(120, 220, 255, 0.45);
}
.vk-run:active, .vk-run.active {
    background: #9ef;
    color: #012;
    box-shadow: 0 0 15px #9ef;
}

<script>
let functionName = "";

class Font {
    static getFont(face, style, size) {
        return new Font();
    }
    getHeight() { return 17; }
    charWidth(c) {
        // Full-width (CJK, fullwidth forms, drawing characters) → 16px cell
        // Half-width / ASCII → 8px cell
        if (typeof c === 'number') c = String.fromCharCode(c);
        const code = c.charCodeAt(0);
        if (code < 0x80) return 8;
        return 16;
    }
}
Font.FACE_MONOSPACE = 0;
Font.STYLE_PLAIN = 0;
Font.SIZE_MEDIUM = 0;

class Graphics {
    constructor(ctx) {
        this.ctx = ctx;
        // Original J2ME code passes y as the text BASELINE position, not the
        // top. Use "alphabetic" so fillText(str, x, y) places the baseline at
        // y — otherwise bottom rows (messages, last grid row) fall off-canvas.
        this.ctx.textBaseline = "alphabetic";
        // Classic terminal feel: Latin monospace + system Japanese fallback.
        // Avoid pixel/dot-matrix faces (they now read as "retro-trendy").
        this.ctx.font = "16px 'Courier New', Courier, 'MS Gothic', 'Osaka', 'Hiragino Kaku Gothic ProN', monospace";
        this.ctx.imageSmoothingEnabled = false;
    }
    
    setColor(c) {
        let hex = c.toString(16);
        while(hex.length < 6) hex = '0' + hex;
        this.ctx.fillStyle = '#' + hex;
        this.ctx.strokeStyle = '#' + hex;
    }
    
    fillRect(x, y, w, h) {
        this.ctx.fillRect(x, y, w, h);
    }

    drawRect(x, y, w, h) {
        this.ctx.strokeRect(x + 0.5, y + 0.5, w, h);
    }

    drawLine(x1, y1, x2, y2) {
        this.ctx.beginPath();
        this.ctx.moveTo(x1, y1);
        this.ctx.lineTo(x2, y2);
        this.ctx.stroke();
    }
    
    drawChar(c, x, y, anchor) {
        let str = typeof c === 'number' ? String.fromCharCode(c) : c;
        // Lift by 2px so descenders ("。","ゃ",etc.) aren't clipped when
        // the baseline y touches the canvas bottom (last message row).
        this.ctx.fillText(str, x, y - 2);
    }

    drawString(str, x, y, anchor) {
        this.ctx.fillText(str, x, y - 2);
    }

    drawChars(data, offset, length, x, y, anchor) {
        let str = "";
        for(let i=0; i<length; i++) {
            let c = data[offset+i];
            str += typeof c === 'number' ? String.fromCharCode(c) : c;
        }
        this.ctx.fillText(str, x, y - 2);
    }

    drawImage(img, x, y, anchor) {
        if(img && img.canvas) {
            this.ctx.drawImage(img.canvas, x, y);
        }
    }

    setFont(f) {
        // Ignored for now
    }
    
    setClip(x, y, w, h) {
        this.ctx.restore();
        this.ctx.save();
        this.ctx.beginPath();
        this.ctx.rect(x, y, w, h);
        this.ctx.clip();
    }

    clipRect(x, y, w, h) {
        this.ctx.beginPath();
        this.ctx.rect(x, y, w, h);
        this.ctx.clip();
    }
}

Graphics.BASELINE = 0;

}

function repaint() {
    // Blit the composite offscreen buffer to the visible canvas.
    // Do NOT call paint(viewGraphics) here: viewGraphics points at the
    // offscreen viewImage, and copying offImage back into it would leave
    // stale HUD/message pixels that re-bleed through on the next frame.
    const canvas = document.getElementById('game-canvas');
    if (canvas && offImage && offImage.canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(offImage.canvas, 0, 0);
    }
    updateHudDom();
}

// Mirrors key player stats into the HTML HUD below the canvas.
// Called from repaint() so every frame stays in sync with game state.
function updateHudDom() {
    try {
        if (typeof pcCurHP === 'undefined') return;
        const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
        set('val-hp',   pcCurHP + '/' + pcMaxHP);
        set('val-str',  pcCurSTR + '/' + pcMaxSTR);
        set('val-gold', String(pcGold));
        set('val-lv',   String(pcLevel));
        // AC: armor contribution only (matches showStatus()).
        let ac = 0;
        if (typeof pcArmor !== 'undefined' && pcArmor) {
            ac = ((pcArmor & 0x00ff00) >>> 8) + 2 + (pcArmor & 0xff) - 3;
        }
        set('val-ac', String(ac));
        // ATK: weapon dice "HdD" with enchant, e.g. "1d4+0".
        let atk = '-';
        if (typeof pcWeapon !== 'undefined' && pcWeapon) {
            const table = [0x0104,0x0105,0x0106,0x0203,0x0304,0x0405];
            const dd = table[(pcWeapon & 0x00ff00) >> 8] || 0x0104;
            const enc = (pcWeapon & 0xff) - 3;
            const hit = Math.max(1, ((dd & 0xff00) >> 8) + enc);
            const dice = Math.max(1, (dd & 0xff) + enc);
            const sign = enc >= 0 ? '+' : '';
            atk = hit + 'd' + dice + sign + enc;
        }
        set('val-atk', atk);
    } catch (e) { /* pre-init: ignore */ }
}

// localStorage-backed implementation of the MIDP RecordStore API.
// Each record store is persisted under key "mirogue.rs.<name>" as a
// JSON array-of-arrays (records[recordId-1] = byte array).
class RecordStore {
    constructor(name) {
        this.name = name;
        try {
            const s = localStorage.getItem('mirogue.rs.' + name);
            this.records = s ? JSON.parse(s) : [];
        } catch (e) { this.records = []; }
    }
    static openRecordStore(name, create) { return new RecordStore(name); }
    _flush() {
        try {
            localStorage.setItem('mirogue.rs.' + this.name, JSON.stringify(this.records));
        } catch (e) {}
    }
    getNumRecords() { return this.records.length; }
    addRecord(data, off, len) {
        const slice = Array.prototype.slice.call(data, off, off + len);
        this.records.push(slice);
        this._flush();
        return this.records.length;
    }
    setRecord(id, data, off, len) {
        const slice = Array.prototype.slice.call(data, off, off + len);
        this.records[id - 1] = slice;
        this._flush();
    }
    getRecord(id) { return this.records[id - 1] || []; }
    closeRecordStore() {}
    static deleteRecordStore(name) {
        try { localStorage.removeItem('mirogue.rs.' + name); } catch (e) {}
    }
}

function Math_abs(n) { return Math.abs(n); }

// Java String.getChars(srcBegin, srcEnd, dst, dstBegin) polyfill —
// used by save routines to serialize names into a byte/char buffer.
if (!String.prototype.getChars) {
    String.prototype.getChars = function(srcBegin, srcEnd, dst, dstBegin) {
        for (let i = srcBegin; i < srcEnd; i++) {
            dst[dstBegin + (i - srcBegin)] = this.charCodeAt(i);
        }
    };
}

            const k = btn.dataset.key;
            const c = commandFor(k);
            if (c) command = c;
        };
        const press = (e) => {
            e.preventDefault();
            btn.classList.add('active');
            fire();
            const k = btn.dataset.key;
            if (REPEATABLE.has(k)) {
                holdTimer = setTimeout(() => {
                    repeatTimer = setInterval(fire, REPEAT_EVERY_MS);
                }, HOLD_DELAY_MS);
            }
        };
        const release = () => {
            btn.classList.remove('active');
            if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
            if (repeatTimer) { clearInterval(repeatTimer); repeatTimer = null; }
        };
        btn.addEventListener('mousedown', press);
        btn.addEventListener('touchstart', press, { passive: false });
        btn.addEventListener('mouseup', release);
        btn.addEventListener('mouseleave', release);
        btn.addEventListener('touchend', release);
        btn.addEventListener('touchcancel', release);
    });
    
    // Mobile browsers (iOS Safari / Android Chrome) aggressively discard
    // backgrounded tabs to free memory. Without persisting state, the player
    // loses their run whenever they switch tabs or apps. Snapshot on any
    // visibility transition or page hide so that on the next launch
    // loadScore() can restore the floor and loadGame() can restore inventory.
    const persistSnapshot = () => {
        try {
            if (typeof gameOverLock !== 'undefined' && gameOverLock) return; // run has ended
            if (typeof curFloor === 'undefined') return;
            if (curFloor <= 0) return;          // no active run
            if (typeof mode !== 'undefined' && mode === 6) return; // gameover
            // Save the *actual* current floor and mark this as a snapshot
            // resume. run() compensates for the post-load newFloor() bump
            // when this flag is set (see run()'s post-loadGame block).
            // saveScore / saveGame are declared `async` but their bodies are
            // fully synchronous (localStorage writes). Firing and forgetting
            // is safe — the writes complete before the event handler
            // returns.
            saveScore();
            saveGame();
            try { localStorage.setItem('mirogue.snapshotResume', '1'); } catch (e) {}
        } catch (e) { /* ignore */ }
    };
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) persistSnapshot();
    });
    window.addEventListener('pagehide', persistSnapshot);

    // Kick off main loop asynchronously
    try {
        console.log("Calling initView()...");
        await initView();
        console.log("Calling run()...");
        await run();
    } catch(e) {
        console.error(e);
    }
}
</script>
